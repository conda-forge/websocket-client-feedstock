schema_version: 1

context:
  name: websocket-client
  version: "1.9.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 0fcb57545848be86992e128218fd96dd87a6769ffdb1a968dff79632b85604d0

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - wsdump=websocket._wsdump:main

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools >=77
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - websocket
        - websocket.tests
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - wsdump --help

about:
  summary: WebSocket client for Python with low level API options
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/websocket-client/websocket-client.git
  repository: https://github.com/websocket-client/websocket-client/
  documentation: https://websocket-client.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - scopatz
    - BastianZim
    - wshanks
